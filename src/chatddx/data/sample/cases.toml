[[case.Dutchfall1w.targets.notes]]
author = "Olof"
language = "sv"
comment = '''
Noterbart är andningsbesvären, på akuten fått extra syrgas, multisjuk med spridd cancersjukdom, inte bättre efter doxycyklin avseende andningsbesvären - tecken på allvarligare infektion eller annan orsak.
Andra orsaker:
Ultraljud: hjärtsvikt? vätska på lungorna? vätska kring hjärtat? indirekta tecken på propp i lungorna?
Breda odlingar för bakterier.
Beställa skiktröntgen med kontrast för att utesluta propp i lungorna (lungemboli).
Disposition: ultraljud - om inga fynd -> odlingar, DT, inläggning.
den kliniska presentationen når för närvarande ej tröskel för behandling avseende blodpropp eller bredspektrum antibiotika. Om försämrad ge blodförtunnande + bredspektrum antibiotika före röntgen'''

