# markers dropped: the targets are treated as live data. Keys are the vignettes' file names at the
# source, `targets` is each case's expectation (schemas/targets.json), and `tags` and `language` are
# entries on its family.
#
# `targets.notes` are Olof's comments, added to the ends of three vignettes after 7893656 (chatddx
# 13d317d: Dutchfall11w and casesfromedn1; 504792c: Dutchfall1w). They're taken out as written, in
# Swedish, with the "Chatddx:" block as the note's `answer`; only the headings, line endings and
# trailing spaces are dropped. The vignettes stay as they were at 7893656.

